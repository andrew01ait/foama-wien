name: foama-wien CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test PWA, server, crypto and transfer behavior
        run: node --test tests/*.test.mjs tests/test_*.mjs
      - name: Test Python import and build helpers
        run: python3 -m unittest discover -s tests -p '*test.py'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find pwa/src cloudflare/src scripts -type f \( -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n 1 node --check
          node --check pwa/sw.js
