services:
  foama-wien-push-timer:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    environment:
      PUSH_INTERVAL_SECONDS: "300"
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.10
    healthcheck:
      test: ["CMD", "python", "/app/timer.py", "--healthcheck"]
      interval: 60s
      timeout: 5s
      start_period: 150s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
